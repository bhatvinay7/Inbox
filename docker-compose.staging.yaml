  http-server:
    container_name: http-server
    build:
      context: .
      dockerfile: apps/http-server/dockerfile.staging.yaml
    ports:
      - "3002:3002"
    env_file:
      -  ./apps/http-server/.env 

    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G     
  publisher-publish-mail-from-imap:
      container_name: publisher-publish-mail-from-imap
      build:
        context: .
        dockerfile: apps/publisher-publish-mail-from-imap/dockerfile.staging.yaml
      ports:
        - "3009:3009"
      env_file:
        -  ./apps/publisher-publish-mail-from-imap/.env
      networks:
        - inbox
      deploy:
        resources:
          limits:
            cpus: '0.25'
            memory: 1G
      depends_on:
        - rabbitmq
        - elasticsearch    
        - http-server                                                    
  label-assigner:
    container_name: label-assigner
    build:
      context: .
      dockerfile: apps/label-assigner/dockerfile.staging.yaml
    ports:
      - "3007:3007"
    env_file:
      -  ./apps/label-assigner/.env
    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 2G
    depends_on:
      - rabbitmq
      - elasticsearch               
  worker:
    container_name: worker
    build:
      context: .
      dockerfile: apps/worker/dockerfile.staging.yaml
    ports:
      - "3008:3008"
    env_file:
      -  ./apps/worker/.env
    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 2G
    depends_on:
      - rabbitmq
      - elasticsearch
  consumer-push2storage:
    container_name: consumer-push2storage
    build:
      context: .
      dockerfile: apps/consumer-push2storage/dockerfile.staging.yaml
    ports:
      - "3010:3010"
    env_file:
      -  ./apps/consumer-push2storage/.env
    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
    depends_on:
      - rabbitmq
      - elasticsearch
