        # limits:
          # cpus: '0.5'
          # memory: 700M
  # postgres-db:
    # image: "postgres:latest"
    # environment:
      # POSTGRES_USER: inbox_user
      # POSTGRES_PASSWORD: inbox_password
      # POSTGRES_DB: inbox_db
    # volumes:
      # - postgres-data:/var/lib/postgresql/data
    # ports:
      # - "5432:5432"
    # networks:
      # - inbox
    # deploy:
      # resources:
        # limits:
          # cpus: '0.4'
          # memory: 700M    
  rabbitmq:
    image: "rabbitmq:3-management"
    environment:
      RABBITMQ_DEFAULT_USER: inbox_user
      RABBITMQ_DEFAULT_PASS: inbox_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G   

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.2 
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
      # - bootstrap.memory_lock=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx2g"
      - "logger.level=DEBUG"
      - "logger.org.elasticsearch=DEBUG"
    volumes:
      - es-data:/usr/share/elasticsearch/data 
      - ./logs:/usr/share/elasticsearch/logs 
    # ulimits:
      # memlock:
        # soft: -1
        # hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - inbox
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: '2G'           
networks:
  inbox:
    driver: bridge          
volumes:    
  es-data:
  rabbitmq-data:
